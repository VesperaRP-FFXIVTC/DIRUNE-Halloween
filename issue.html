<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【關主後台】契約碼派發</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #1a1525; color: #f3e8ff; font-family: sans-serif; display: flex; justify-content: center; padding: 40px 16px; margin: 0; }
        .admin-panel { background: rgba(0,0,0,0.5); border: 2px solid #ff7300; padding: 28px 24px; border-radius: 15px; width: 100%; max-width: 460px; box-shadow: 0 0 20px rgba(255,115,0,0.2); }
        h1 { color: #ff7300; margin: 0 0 20px; text-align: center; }
        h2 { font-size: 1.3rem; color: #a855f7; border-top: 1px dashed #6b21a8; padding-top: 20px; margin: 28px 0 14px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #a855f7; }
        .form-group { margin-bottom: 16px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #a855f7; background: #0b0510; color: #fff; font-size: 1.05rem; }
        input:focus, select:focus { outline: none; border-color: #ff7300; box-shadow: 0 0 10px rgba(255,115,0,0.4); }
        button { background: #ff7300; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 1.15rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover:not(:disabled) { background: #cc5c00; box-shadow: 0 0 15px #ff7300; }
        button:disabled { opacity: 0.5; cursor: wait; }
        button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .btn-ghost { background: transparent; border: 1px solid #6b21a8; color: #c4a5f5; font-size: 0.9rem; padding: 8px 12px; width: auto; }
        .btn-ghost:hover:not(:disabled) { background: #6b21a8; color: #fff; box-shadow: none; }
        .row { display: flex; gap: 10px; }
        .row > .form-group { flex: 1; }
        .status { margin-top: 10px; font-weight: bold; min-height: 1.4em; text-align: center; }
        .hidden { display: none !important; }

        /* 新派發的契約碼：大字卡片，方便直接給玩家看 */
        .new-codes { margin-top: 16px; }
        .new-codes-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: #4ade80; font-weight: bold; }
        .code-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .code-card { background: #0b0510; border: 2px solid #ff7300; border-radius: 10px; padding: 14px 6px; text-align: center; cursor: pointer; transition: 0.2s; }
        .code-card:hover { background: rgba(255,115,0,0.12); }
        .code-card .code { font-family: monospace; font-size: 1.9rem; font-weight: bold; letter-spacing: 5px; color: #ff7300; text-shadow: 0 0 8px rgba(255,115,0,0.6); }
        .code-card .tip { font-size: 0.75rem; color: #a78bca; margin-top: 4px; }
        .code-card.copied { border-color: #4ade80; }
        .code-card.copied .tip { color: #4ade80; }

        /* 派發紀錄 */
        .list-tools { display: flex; gap: 10px; margin-bottom: 10px; }
        .list-tools input { flex: 1; padding: 9px 12px; font-size: 0.95rem; }
        .code-list { max-height: 360px; overflow-y: auto; border: 1px solid #3b1d5e; border-radius: 8px; }
        .code-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #2a1840; }
        .code-row:last-child { border-bottom: none; }
        .code-row .c { font-family: monospace; font-size: 1.15rem; font-weight: bold; letter-spacing: 3px; color: #ff7300; min-width: 4.5em; }
        .code-row .n { flex: 1; color: #e9dcf7; font-size: 0.95rem; word-break: break-all; }
        .code-row .t { color: #8b7aa3; font-size: 0.8rem; white-space: nowrap; }
        .code-row { flex-wrap: wrap; }
        .code-row .timer { display: flex; align-items: center; gap: 8px; width: 100%; padding-left: 4.5em; margin-left: 12px; font-size: 0.85rem; }
        .timer-state { font-family: monospace; font-weight: bold; }
        .timer-state.idle { color: #8b7aa3; }
        .timer-state.run { color: #4ade80; }
        .timer-state.low { color: #fbbf24; }
        .timer-state.over { color: #ef4444; }
        .timer-state.clear { color: #fbbf24; }
        .rank { min-width: 2.2em; font-weight: bold; color: #fbbf24; }
        .rank-on { background: #92400e !important; color: #fff !important; border-color: #fbbf24 !important; }
        .mini-btn { background: transparent; border: 1px solid #6b21a8; color: #c4a5f5; font-size: 0.78rem; padding: 3px 9px; width: auto; border-radius: 6px; cursor: pointer; }
        .mini-btn:hover { background: #6b21a8; color: #fff; box-shadow: none; }
        .mini-btn.start { border-color: #16a34a; color: #4ade80; }
        .mini-btn.start:hover { background: #16a34a; color: #fff; }
        .stamp-count { color: #a78bca; }
        .batch-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .batch-bar button { flex: 1; font-size: 0.95rem; padding: 10px; background: #16a34a; }
        .batch-bar button:hover:not(:disabled) { background: #15803d; box-shadow: 0 0 12px #16a34a; }
        .timer-tip { font-size: 0.78rem; color: #8b7aa3; margin: -2px 0 12px; line-height: 1.6; }
        .empty { padding: 20px; text-align: center; color: #8b7aa3; }
        .count-note { font-size: 0.85rem; color: #8b7aa3; margin-top: 8px; text-align: right; }
    </style>
</head>
<body>
<div class="admin-panel">
    <h1>📜 契約碼派發</h1>

    <!-- 第一步：管理密碼 -->
    <div id="keySection">
        <div class="form-group">
            <label for="adminKey">關主密碼</label>
            <input type="password" id="adminKey" placeholder="輸入在 Apps Script 設定的 ADMIN_KEY" autocomplete="current-password">
        </div>
        <button id="loginBtn">進入後台</button>
        <div class="status" id="keyStatus"></div>
    </div>

    <!-- 第二步：派發 -->
    <div id="mainSection" class="hidden">
        <div class="row">
            <div class="form-group">
                <label for="note">備註（玩家／隊伍名稱）</label>
                <input type="text" id="note" placeholder="例如：Inu@泰坦 21:15" maxlength="60">
            </div>
        </div>
        <div class="form-group">
            <label for="count">派發數量</label>
            <select id="count"></select>
        </div>
        <button id="issueBtn">派發契約碼</button>
        <div class="status" id="issueStatus"></div>

        <div class="new-codes hidden" id="newCodes">
            <div class="new-codes-head">
                <span>✅ 新的契約碼（點擊可複製）</span>
                <button class="btn-ghost" id="copyAllBtn">全部複製</button>
            </div>
            <div class="code-cards" id="codeCards"></div>
            <button id="startNewBtn" style="margin-top:12px; background:#16a34a;">▶ 這批魔書開始計時（45 分鐘）</button>
        </div>

        <h2>📖 派發紀錄</h2>
        <div class="list-tools">
            <input type="search" id="search" placeholder="搜尋契約碼或備註">
            <button class="btn-ghost" id="rankBtn">🏆 通關排名</button>
            <button class="btn-ghost" id="refreshBtn">重新整理</button>
        </div>
        <div class="batch-bar">
            <button id="startFilteredBtn">▶ 列表中「未開始」的魔書全部開始計時</button>
        </div>
        <div class="timer-tip">小技巧：派發時在備註填上時段（例如 21:15），聽完說明後搜尋「21:15」，再按上面的按鈕，就能讓整個時段同時開始計時。</div>
        <div class="code-list" id="codeList"><div class="empty">讀取中…</div></div>
        <div class="count-note" id="countNote"></div>

        <div style="text-align:center; margin-top:20px;">
            <button class="btn-ghost" id="logoutBtn">登出此裝置</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzhmLK2BTTQQ4hej4SHwhzOgYWhoI5u29c4d6iDeaWyFz97ydRNYbCC32hUnJ129_0Wdw/exec";
    const KEY_STORAGE = "sealhunter_admin_key";

    const $ = id => document.getElementById(id);
    let adminKey = "";
    let allCodes = [];

    for (let i = 1; i <= 10; i++) {
        $('count').insertAdjacentHTML('beforeend', `<option value="${i}">${i} 本魔書</option>`);
    }

    function setStatus(el, text, color) { el.style.color = color; el.textContent = text; }

    function api(payload) {
        return fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ ...payload, key: adminKey })
        }).then(res => res.json());
    }

    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function formatTime(value) {
        const d = new Date(value);
        if (isNaN(d)) return '';
        const pad = n => String(n).padStart(2, '0');
        return `${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // ===== 登入（用讀取紀錄來驗證密碼是否正確）=====
    function login(key, silent) {
        adminKey = key;
        if (!silent) setStatus($('keyStatus'), "⏳ 驗證中…", "#fbbf24");
        $('loginBtn').disabled = true;

        api({ action: 'list_codes' }).then(res => {
            if (res.status === "success") {
                try { localStorage.setItem(KEY_STORAGE, key); } catch (e) {}
                $('keySection').classList.add('hidden');
                $('mainSection').classList.remove('hidden');
                allCodes = res.codes || [];
                syncClock(res);
                renderList();
            } else {
                try { localStorage.removeItem(KEY_STORAGE); } catch (e) {}
                setStatus($('keyStatus'), "❌ " + (res.message || "密碼錯誤"), "#ef4444");
            }
        }).catch(() => {
            setStatus($('keyStatus'), "❌ 連線失敗，請檢查網路", "#ef4444");
        }).finally(() => { $('loginBtn').disabled = false; });
    }

    $('loginBtn').addEventListener('click', () => {
        const key = $('adminKey').value.trim();
        if (!key) return setStatus($('keyStatus'), "❌ 請輸入關主密碼", "#ef4444");
        login(key);
    });
    $('adminKey').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

    $('logoutBtn').addEventListener('click', () => {
        try { localStorage.removeItem(KEY_STORAGE); } catch (e) {}
        location.reload();
    });

    // ===== 派發 =====
    $('issueBtn').addEventListener('click', () => {
        const count = parseInt($('count').value, 10);
        const note = $('note').value.trim();

        $('issueBtn').disabled = true;
        setStatus($('issueStatus'), "⏳ 魔法刻印中…", "#fbbf24");

        api({ action: 'issue_codes', count, note }).then(res => {
            if (res.status === "success") {
                setStatus($('issueStatus'), "", "");
                showNewCodes(res.codes);
                $('note').value = "";
                $('count').value = "1";
                refreshList();
            } else {
                setStatus($('issueStatus'), "❌ " + res.message, "#ef4444");
            }
        }).catch(() => {
            setStatus($('issueStatus'), "❌ 連線失敗，請檢查網路", "#ef4444");
        }).finally(() => { $('issueBtn').disabled = false; });
    });

    function showNewCodes(codes) {
        $('newCodes').classList.remove('hidden');
        $('startNewBtn').textContent = '▶ 這批魔書開始計時（45 分鐘）';
        $('codeCards').innerHTML = codes.map(c =>
            `<div class="code-card" data-code="${c}"><div class="code">${c}</div><div class="tip">點擊複製</div></div>`
        ).join('');
        $('copyAllBtn').dataset.codes = codes.join('\n');
    }

    function copyText(text) {
        if (navigator.clipboard) return navigator.clipboard.writeText(text);
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        return Promise.resolve();
    }

    $('codeCards').addEventListener('click', e => {
        const card = e.target.closest('.code-card');
        if (!card) return;
        copyText(card.dataset.code).then(() => {
            card.classList.add('copied');
            card.querySelector('.tip').textContent = '已複製';
        });
    });

    $('copyAllBtn').addEventListener('click', () => {
        copyText($('copyAllBtn').dataset.codes).then(() => {
            $('copyAllBtn').textContent = '已全部複製';
            setTimeout(() => { $('copyAllBtn').textContent = '全部複製'; }, 1500);
        });
    });

    // ===== 派發紀錄 =====
    function refreshList() {
        api({ action: 'list_codes' }).then(res => {
            if (res.status === "success") {
                allCodes = res.codes || [];
                syncClock(res);
                renderList();
            }
        });
    }

    // ===== 計時 =====
    let clockOffset = 0, limitMs = 45 * 60000;
    function syncClock(res) {
        if (res.serverNow) clockOffset = new Date(res.serverNow).getTime() - Date.now();
        if (res.limitMin) limitMs = res.limitMin * 60000;
    }
    const nowMs = () => Date.now() + clockOffset;
    const fmt = ms => { const t = Math.max(0, Math.round(ms / 1000)); return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
    const clearMs = c => (c.clearedAt && c.startedAt) ? new Date(c.clearedAt) - new Date(c.startedAt) : null;
    function timerInfo(c) {
        if (c.clearedAt) return { cls: 'clear', text: clearMs(c) !== null ? `🏆 通關 ${fmt(clearMs(c))}` : '🏆 已通關' };
        if (!c.startedAt) return { cls: 'idle', text: '未開始計時' };
        const left = new Date(c.startedAt).getTime() + limitMs - nowMs();
        if (left <= 0) return { cls: 'over', text: '⏰ 時間到' };
        const m = Math.floor(left / 60000), sec = Math.floor(left / 1000) % 60;
        return { cls: left < 5 * 60000 ? 'low' : 'run', text: `⏳ ${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` };
    }
    function startTimer(codes, force = false) {
        if (!codes.length) { alert('沒有需要開始計時的魔書。'); return Promise.resolve(); }
        return api({ action: 'start_timer', codes, force }).then(res => {
            if (res.status !== 'success') { alert('❌ ' + (res.message || '開始計時失敗')); return; }
            refreshList();
        }).catch(() => alert('❌ 連線失敗，請檢查網路'));
    }
    function resetTimer(code) {
        if (!confirm(`確定要把 ${code} 的計時重設為「未開始」嗎？`)) return;
        api({ action: 'reset_timer', codes: [code] }).then(res => {
            if (res.status !== 'success') { alert('❌ ' + (res.message || '重設失敗')); return; }
            refreshList();
        });
    }
    // 每秒更新列表上的倒數
    setInterval(() => {
        document.querySelectorAll('.timer-state[data-code]').forEach(el => {
            const c = allCodes.find(x => x.code === el.dataset.code);
            if (!c) return;
            const info = timerInfo(c);
            el.className = 'timer-state ' + info.cls; el.textContent = info.text;
        });
    }, 1000);

    let rankMode = false;
    function renderList() {
        const q = $('search').value.trim().toUpperCase();
        let rows = allCodes.filter(c =>
            !q || c.code.includes(q) || String(c.note || '').toUpperCase().includes(q)
        );
        // 通關排名模式：只列出已通關的魔書，依「擊敗魔王的時刻」先後排序
        if (rankMode) rows = rows.filter(c => c.clearedAt).sort((a, b) => new Date(a.clearedAt) - new Date(b.clearedAt));
        $('codeList').innerHTML = rows.length
            ? rows.map((c, i) => `
                <div class="code-row">
                    ${rankMode ? `<span class="rank">${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'}</span>` : ''}
                    <span class="c">${escapeHtml(c.code)}</span>
                    <span class="n">${escapeHtml(c.note) || '<span style="color:#6b5a80">（無備註）</span>'}</span>
                    <span class="t">${formatTime(c.createdAt)}</span>
                    <div class="timer">
                        <span class="timer-state ${timerInfo(c).cls}" data-code="${escapeHtml(c.code)}">${timerInfo(c).text}</span>
                        <span class="stamp-count">紋章 ${c.stamps || 0} / 17</span>
                        <span style="flex:1"></span>
                        ${c.startedAt
                            ? `<button class="mini-btn" data-reset="${escapeHtml(c.code)}">重設</button>`
                            : `<button class="mini-btn start" data-start="${escapeHtml(c.code)}">▶ 開始</button>`}
                    </div>
                </div>`).join('')
            : `<div class="empty">${rankMode ? '還沒有人擊敗魔王' : allCodes.length ? '找不到符合的紀錄' : '還沒有派發任何契約碼'}</div>`;
        $('countNote').textContent = `共派發 ${allCodes.length} 本魔書`;
    }

    $('search').addEventListener('input', renderList);
    $('rankBtn').addEventListener('click', () => {
        rankMode = !rankMode;
        $('rankBtn').classList.toggle('rank-on', rankMode);
        renderList();
    });
    $('codeList').addEventListener('click', e => {
        const s = e.target.closest('[data-start]'), r = e.target.closest('[data-reset]');
        if (s) { s.disabled = true; startTimer([s.dataset.start]); }
        if (r) resetTimer(r.dataset.reset);
    });
    $('startFilteredBtn').addEventListener('click', () => {
        const q = $('search').value.trim().toUpperCase();
        const targets = allCodes.filter(c => !c.startedAt && (!q || c.code.includes(q) || String(c.note || '').toUpperCase().includes(q))).map(c => c.code);
        if (!targets.length) { alert('列表中沒有「未開始」的魔書。'); return; }
        if (!confirm(`要讓這 ${targets.length} 本魔書開始計時嗎？\n${targets.join('、')}`)) return;
        $('startFilteredBtn').disabled = true;
        startTimer(targets).finally(() => { $('startFilteredBtn').disabled = false; });
    });
    $('startNewBtn').addEventListener('click', () => {
        const codes = ($('copyAllBtn').dataset.codes || '').split('\n').filter(Boolean);
        $('startNewBtn').disabled = true;
        startTimer(codes).then(() => { $('startNewBtn').textContent = '✅ 已開始計時'; }).finally(() => { $('startNewBtn').disabled = false; });
    });
    $('refreshBtn').addEventListener('click', refreshList);

    // 這台裝置之前登入過的話，自動登入
    try {
        const saved = localStorage.getItem(KEY_STORAGE);
        if (saved) login(saved, true);
    } catch (e) {}
</script>
</body>
</html>
