<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【關主後台】紋章賦予與查詢系統</title>
    <script src="stamps.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #1a1525; color: #f3e8ff; font-family: sans-serif; display: flex; justify-content: center; padding: 30px 14px; margin: 0; }
        .admin-panel { background: rgba(0,0,0,0.5); border: 2px solid #ff7300; padding: 26px 20px; border-radius: 15px; text-align: center; width: 100%; max-width: 520px; box-shadow: 0 0 20px rgba(255,115,0,0.2); }
        h1, h2 { color: #ff7300; margin: 0 0 20px; }
        h2 { font-size: 1.4rem; color: #a855f7; border-top: 1px dashed #6b21a8; padding-top: 22px; margin-top: 30px; }
        .hidden { display: none !important; }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: #a855f7; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #a855f7; background: #0b0510; color: #fff; font-size: 1.1rem; text-transform: uppercase; }
        input[type="password"] { text-transform: none; }
        input:focus { outline: none; border-color: #ff7300; box-shadow: 0 0 10px rgba(255,115,0,0.4); }
        button { background: #ff7300; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        button:hover:not(:disabled) { background: #cc5c00; box-shadow: 0 0 15px #ff7300; }
        button:disabled { opacity: 0.5; cursor: wait; }
        .btn-check { background: #6b21a8; }
        .btn-check:hover:not(:disabled) { background: #4c1d95; box-shadow: 0 0 15px #6b21a8; }
        .btn-ghost { background: transparent; border: 1px solid #6b21a8; color: #c4b5fd; font-size: 0.9rem; padding: 8px 12px; width: auto; margin: 0; }
        .btn-ghost:hover:not(:disabled) { background: #1c1030; box-shadow: none; }
        .status { margin-top: 6px; font-weight: bold; min-height: 1.4em; white-space: pre-line; }

        /* 紋章選擇：圖片按鈕（可多選） */
        .picker-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .picker-head label { margin: 0; }
        .stamp-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
        .stamp-opt {
            position: relative;
            background: #0b0510;
            border: 2px solid #3b1d5e;
            border-radius: 10px;
            padding: 6px 4px 6px;
            margin: 0;
            font-size: 0.85rem;
            font-weight: bold;
            color: #e9dcf7;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: 0.15s;
        }
        .stamp-opt:hover:not(:disabled) { background: #1c1030; border-color: #a855f7; box-shadow: none; }
        .stamp-opt.selected { border-color: #ff7300; background: rgba(255,115,0,0.15); box-shadow: 0 0 10px rgba(255,115,0,0.5); }
        .stamp-opt.selected::after {
            content: '✓'; position: absolute; top: 3px; right: 5px;
            background: #ff7300; color: #fff; width: 18px; height: 18px; border-radius: 50%;
            font-size: 0.75rem; line-height: 18px;
        }
        .stamp-opt img { width: 56px; height: 56px; object-fit: contain; }
        .stamp-opt .stage { font-size: 0.68rem; color: #a78bca; font-weight: normal; }
        .stamp-opt .ph { width: 56px; height: 56px; border-radius: 50%; border: 2px dashed #6b21a8; display: flex; align-items: center; justify-content: center; color: #a855f7; }

        .selected-bar { margin: 14px 0 12px; min-height: 1.4em; color: #fbbf24; font-weight: bold; }

        /* 查詢結果 */
        .result-box { background: rgba(107,33,168,0.2); border: 1px solid #6b21a8; padding: 15px; border-radius: 8px; text-align: left; margin-top: 15px; display: none; }
        .result-box p { margin: 5px 0; color: #fff; }
        .owned { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-top: 10px; }
        .owned-item { text-align: center; font-size: 0.75rem; color: #e9dcf7; opacity: 0.3; }
        .owned-item.got { opacity: 1; }
        .owned-item img, .owned-item .ph { width: 48px; height: 48px; object-fit: contain; display: block; margin: 0 auto 2px; }
        .owned-item .ph { border-radius: 50%; border: 2px dashed #6b21a8; }
        .legend { font-size: 0.8rem; color: #8b7aa3; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="admin-panel">
        <h1>🗡️ 紋章賦予系統</h1>

        <!-- 第一步：關主密碼（和 issue.html 共用同一組，登入過一次就會記住） -->
        <div id="keySection">
            <div class="form-group">
                <label for="adminKey">關主密碼</label>
                <input type="password" id="adminKey" placeholder="輸入在 Apps Script 設定的 ADMIN_KEY" autocomplete="current-password">
            </div>
            <button id="loginBtn">進入後台</button>
            <div class="status" id="keyStatus"></div>
        </div>

        <!-- 第二步：賦予／查詢 -->
        <div id="mainSection" class="hidden">
            <div class="form-group">
                <label for="playerId">玩家魔書編號 (4碼)</label>
                <input type="text" id="playerId" placeholder="例如: A7K9" maxlength="4" autocomplete="off">
            </div>

            <div class="form-group">
                <div class="picker-head">
                    <label>選擇給予的紋章（可多選）</label>
                    <button type="button" class="btn-ghost" id="clearBtn">清除選擇</button>
                </div>
                <div class="stamp-picker" id="stampPicker"></div>
            </div>

            <div class="selected-bar" id="selectedBar"></div>
            <button id="giveBtn" onclick="giveStamps()">賦予紋章</button>
            <div class="status" id="statusText"></div>

            <h2>🔍 魔書狀態查詢 (兌換核對)</h2>
            <div class="form-group">
                <input type="text" id="checkId" placeholder="輸入玩家編號查詢進度" maxlength="4" autocomplete="off">
            </div>
            <button class="btn-check" id="checkBtn" onclick="checkPlayer()">查詢收集進度</button>

            <div class="result-box" id="resultBox">
                <p><strong>玩家編號：</strong> <span id="resId" style="color:#ff7300;"></span></p>
                <p><strong>收集進度：</strong> <span id="resCount" style="color:#4ade80;"></span> / 17</p>
                <p id="resClear" style="display:none;"></p>
                <div class="owned" id="resList"></div>
                <div class="legend" id="resNote"></div>
            </div>

            <div style="text-align:center; margin-top:24px;">
                <button class="btn-ghost" id="logoutBtn">登出此裝置</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzhmLK2BTTQQ4hej4SHwhzOgYWhoI5u29c4d6iDeaWyFz97ydRNYbCC32hUnJ129_0Wdw/exec";
        const KEY_STORAGE = "sealhunter_admin_key";   // 和 issue.html 同一個，登入一次兩頁都通用
        const $ = id => document.getElementById(id);

        let adminKey = "";
        const selected = new Set();

        function setStatus(el, text, color) { el.style.color = color; el.textContent = text; }

        // 所有寫入動作都會自動帶上關主密碼
        function api(payload) {
            return fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ ...payload, key: adminKey })
            }).then(res => res.json());
        }

        // ===== 登入（用讀取派發紀錄來驗證密碼是否正確）=====
        function login(key, silent) {
            adminKey = key;
            if (!silent) setStatus($('keyStatus'), "⏳ 驗證中…", "#fbbf24");
            $('loginBtn').disabled = true;

            api({ action: 'list_codes' }).then(res => {
                if (res.status === "success") {
                    try { localStorage.setItem(KEY_STORAGE, key); } catch (e) {}
                    $('keySection').classList.add('hidden');
                    $('mainSection').classList.remove('hidden');
                    $('playerId').focus();
                } else {
                    try { localStorage.removeItem(KEY_STORAGE); } catch (e) {}
                    setStatus($('keyStatus'), "❌ " + (res.message || "密碼錯誤"), "#ef4444");
                }
            }).catch(() => {
                setStatus($('keyStatus'), "❌ 連線失敗，請檢查網路", "#ef4444");
            }).finally(() => { $('loginBtn').disabled = false; });
        }

        $('loginBtn').addEventListener('click', () => {
            const key = $('adminKey').value.trim();
            if (!key) return setStatus($('keyStatus'), "❌ 請輸入關主密碼", "#ef4444");
            login(key);
        });
        $('adminKey').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

        $('logoutBtn').addEventListener('click', () => {
            try { localStorage.removeItem(KEY_STORAGE); } catch (e) {}
            location.reload();
        });

        // 這台裝置登入過的話，自動登入
        try {
            const saved = localStorage.getItem(KEY_STORAGE);
            if (saved) { $('adminKey').value = saved; login(saved, true); }
        } catch (e) {}

        // 圖片讀不到時，換成虛線圓圈＋編號
        function imgTag(n) {
            return `<img src="${stampImageUrl(n)}" alt="" onerror="this.outerHTML='<span class=&quot;ph&quot;>${n}</span>'">`;
        }

        // ===== 產生紋章選擇按鈕（點一下選取、再點一下取消）=====
        const picker = $('stampPicker');
        for (let i = 1; i <= 17; i++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'stamp-opt';
            btn.dataset.id = i;
            btn.innerHTML = `${imgTag(i)}<span>${stampName(i)}</span><span class="stage">${stampStage(i)}</span>`;
            btn.addEventListener('click', () => {
                if (selected.has(i)) { selected.delete(i); btn.classList.remove('selected'); }
                else { selected.add(i); btn.classList.add('selected'); }
                updateSelectedBar();
            });
            picker.appendChild(btn);
        }

        function sortedSelection() { return [...selected].sort((a, b) => a - b); }

        function updateSelectedBar() {
            const ids = sortedSelection();
            $('selectedBar').textContent = ids.length
                ? `已選擇 ${ids.length} 枚：${ids.map(stampName).join('、')}`
                : '';
            $('giveBtn').textContent = ids.length > 1 ? `賦予 ${ids.length} 枚紋章` : '賦予紋章';
        }

        function clearSelection() {
            selected.clear();
            document.querySelectorAll('.stamp-opt').forEach(b => b.classList.remove('selected'));
            updateSelectedBar();
        }
        $('clearBtn').addEventListener('click', clearSelection);

        // ===== 賦予紋章（一次多枚，逐枚送出避免試算表同時寫入衝突）=====
        async function giveStamps() {
            const status = $('statusText');
            const playerId = $('playerId').value.trim().toUpperCase();
            if (playerId.length !== 4) return setStatus(status, "❌ 請輸入 4 碼編號", "#ef4444");
            const ids = sortedSelection();
            if (!ids.length) return setStatus(status, "❌ 請至少選擇一枚紋章", "#ef4444");

            const btn = $('giveBtn');
            btn.disabled = true;

            const ok = [], failed = [];
            let clearInfo = '';   // 第 17 枚紋章會附上通關時間
            for (let k = 0; k < ids.length; k++) {
                const id = ids[k];
                setStatus(status, `⏳ 魔法傳輸中…（${k + 1} / ${ids.length}）${stampName(id)}`, "#fbbf24");
                try {
                    const res = await api({ action: 'add_stamp', code: playerId, stampId: id });
                    if (res.status === "success") {
                        ok.push(id);
                        const m = (res.message || '').match(/（通關時間.*?）/);
                        if (m) clearInfo = m[0];
                    }
                    else {
                        failed.push(`${stampName(id)}：${res.message || '失敗'}`);
                        // 密碼失效或契約碼不存在時，後面也不會成功，直接停止
                        if (/密碼|契約碼|查無/.test(res.message || '')) {
                            ids.slice(k + 1).forEach(r => failed.push(`${stampName(r)}：未送出`));
                            break;
                        }
                    }
                } catch (e) {
                    failed.push(`${stampName(id)}：連線失敗`);
                }
            }

            btn.disabled = false;

            // 成功的紋章取消選取，失敗的保留，方便直接重按一次
            ok.forEach(id => {
                selected.delete(id);
                picker.querySelector(`[data-id="${id}"]`).classList.remove('selected');
            });
            updateSelectedBar();

            let msg = ok.length ? `✅ 已賦予 ${playerId}：${ok.map(stampName).join('、')}` : '';
            if (clearInfo) msg += `\n🏆 擊敗魔王！${clearInfo}`;
            if (failed.length) msg += (msg ? '\n' : '') + `❌ 未成功：\n${failed.join('\n')}`;
            setStatus(status, msg, failed.length ? (ok.length ? "#fbbf24" : "#ef4444") : "#4ade80");

            if (failed.some(f => f.includes('密碼'))) {
                try { localStorage.removeItem(KEY_STORAGE); } catch (e) {}
            }
        }

        // ===== 查詢玩家進度 =====
        function checkPlayer() {
            const checkId = $('checkId').value.trim().toUpperCase();
            if (checkId.length !== 4) { alert("請輸入 4 碼玩家編號"); return; }

            const list = $('resList');
            const note = $('resNote');
            $('resultBox').style.display = 'block';
            $('resId').textContent = checkId;
            $('resCount').textContent = "-";
            list.innerHTML = '';
            $('resClear').style.display = 'none';
            note.textContent = "讀取中...";

            fetch(`${API_URL}?action=get_stamps&code=${encodeURIComponent(checkId)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        const owned = new Set(data.stamps.map(Number));
                        $('resCount').textContent = owned.size;
                        let html = '';
                        for (let i = 1; i <= 17; i++) {
                            html += `<div class="owned-item${owned.has(i) ? ' got' : ''}">${imgTag(i)}${stampName(i)}</div>`;
                        }
                        list.innerHTML = html;
                        note.textContent = owned.size ? '亮起的是已獲得的紋章，暗的是尚未獲得' : '尚未獲得任何紋章';
                        // 通關資訊：通關時間、路線、擊敗者
                        const rc = $('resClear');
                        if (data.clearedAt) {
                            let t = '';
                            if (data.startedAt) {
                                const sec = Math.round((new Date(data.clearedAt) - new Date(data.startedAt)) / 1000);
                                t = `${Math.floor(sec / 60)} 分 ${sec % 60} 秒`;
                            }
                            const route = data.route === '感化' ? '🐾 感化路線' : data.route === '討伐' ? '⚔ 討伐路線' : '（關主手動蓋章）';
                            rc.innerHTML = `<strong>🏆 已擊敗魔王：</strong> <span style="color:#fbbf24;">${t || '已通關'}</span><br>` +
                                `<span style="color:${data.route === '討伐' ? '#f87171' : '#f9a8d4'};">${route}</span>` +
                                (data.winner ? `・擊敗者 <span style="color:#fff;"></span>` : '');
                            if (data.winner) rc.querySelector('span:last-child').textContent = data.winner;
                            rc.style.display = 'block';
                        } else {
                            rc.style.display = 'none';
                        }
                    } else {
                        note.textContent = "❌ " + (data.message || "查無此契約碼");
                    }
                }).catch(() => {
                    note.textContent = "❌ 讀取失敗，請重試";
                });
        }

        $('checkId').addEventListener('keydown', e => { if (e.key === 'Enter') checkPlayer(); });
        $('playerId').addEventListener('keydown', e => { if (e.key === 'Enter') giveStamps(); });
    </script>
</body>
</html>
